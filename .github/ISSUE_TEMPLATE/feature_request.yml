name: Feature request
description: Suggest a product, analysis or workflow improvement
title: "[Feature] "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Start with the developer problem rather than a proposed implementation.
    validations:
      required: true
  - type: textarea
    id: workflow
    attributes:
      label: Desired workflow
      description: What would you like to be able to ask PHPFlow or do with its output?
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Examples, screenshots or related tooling are welcome.
    validations:
      required: false
